<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cal — Intelligent Scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root{
  --teal:#0d9488;--teal-light:#f0fdfa;--teal-border:#99f6e4;--teal-mid:#14b8a6;
  --blue:#1a73e8;--blue-light:#e8f0fe;--blue-border:#aecbfa;
  --amber:#b45309;--amber-light:#fef7e0;--amber-border:#fde68a;
  --red:#c5221f;--red-light:#fce8e6;--red-border:#fca5a5;
  --text-primary:#111827;--text-secondary:#6b7280;--text-tertiary:#9ca3af;
  --border:#e5e7eb;--border-strong:#d1d5db;
  --surface:#ffffff;--surface-raised:#f9fafb;--bg:#f3f4f6;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:20px;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text-primary);height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}

/* ── TOP BAR ── */
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:4px;flex-shrink:0;z-index:10}
.topbar-logo{font-size:20px;font-weight:600;color:var(--blue);letter-spacing:-0.4px;margin-right:16px}
.topbar-nav{display:flex;gap:2px}
.topbar-btn{padding:7px 16px;border-radius:20px;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--text-secondary);letter-spacing:-0.1px;transition:background 150ms ease,color 150ms ease}
.topbar-btn:hover{background:var(--surface-raised)}
.topbar-btn.active{background:var(--blue-light);color:var(--blue)}
.topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.topbar-new{padding:8px 20px;border-radius:20px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:600;letter-spacing:-0.1px;display:flex;align-items:center;gap:6px;transition:background 150ms ease,transform 150ms ease}
.topbar-new:hover{background:#1765cc}
.topbar-new:active{transform:scale(.97)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}

/* ── LAYOUT ── */
.app-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:0}
.main{flex:1;min-width:0;width:100%;overflow:hidden;display:flex;flex-direction:column;position:relative}
.right-panel{width:0;min-width:0;flex-shrink:0;background:var(--surface);border:none;overflow:hidden;transform:translateX(100%);opacity:0;transition:transform 190ms cubic-bezier(.4,0,.2,1),opacity 190ms ease,width 190ms cubic-bezier(.4,0,.2,1);will-change:transform,opacity,width}
.right-panel.open{width:308px;transform:translateX(0);opacity:1;overflow-y:auto;border-left:1px solid var(--border)}

/* ── SIDEBAR ── */
.mini-cal-header{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 10px}
.mini-month{font-size:13px;font-weight:600;color:var(--text-primary);letter-spacing:-0.2px}
.mini-nav{border:none;background:transparent;color:var(--text-secondary);font-size:16px;padding:2px 6px;border-radius:50%;transition:background 150ms ease}
.mini-nav:hover{background:var(--surface-raised)}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;padding:0 4px}
.mini-day{font-size:11.5px;text-align:center;padding:4px 2px;border-radius:50%;color:var(--text-secondary);cursor:pointer;transition:background 120ms ease}
.mini-day:hover:not(.label){background:var(--surface-raised)}
.mini-day.label{color:var(--text-tertiary);font-weight:600;font-size:10px;cursor:default}
.mini-day.today{background:var(--blue);color:#fff;font-weight:500}
.sidebar-divider{height:1px;background:var(--border);margin:12px 4px}
.sidebar-section{font-size:10px;font-weight:600;color:var(--text-tertiary);letter-spacing:.06em;padding:0 12px 6px;text-transform:uppercase}
.cal-chip{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:8px;font-size:13px;color:var(--text-primary);transition:background 150ms ease;cursor:default}
.cal-chip:hover{background:var(--surface-raised)}
.cal-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ── WEEKLY LOAD SUMMARY (sidebar) ── */
.load-summary{margin:8px 4px 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.load-summary-title{font-size:10px;font-weight:600;color:var(--text-tertiary);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.load-days{display:flex;gap:3px;align-items:flex-end;height:32px;margin-bottom:5px}
.load-bar{flex:1;border-radius:3px 3px 0 0;min-height:4px;transition:height 300ms ease}
.load-day-labels{display:flex;gap:3px}
.load-day-label{flex:1;font-size:9px;color:var(--text-tertiary);text-align:center;font-weight:500}
.load-legend{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.load-legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-secondary)}
.load-legend-dot{width:7px;height:7px;border-radius:50%}

/* ── WEEK GRID ── */
.week-header{display:grid;grid-template-columns:52px repeat(7,1fr);border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;width:100%;min-width:0}
.wh-spacer{border-right:1px solid var(--border)}
.wh-day{text-align:center;padding:10px 4px 5px;border-right:1px solid var(--border);cursor:pointer;transition:background 150ms ease}
.wh-day:hover{background:var(--surface-raised)}
.wh-day-name{font-size:10px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em}
.wh-day-num{font-size:22px;font-weight:400;color:var(--text-secondary);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;margin:3px auto 0}
.wh-day-num.today{background:var(--blue);color:#fff;font-weight:500}
.wh-load-strip{height:6px;border-radius:3px;margin:4px 10px 5px;transition:background 300ms ease}
.week-scroll{flex:1;overflow-y:auto;position:relative;width:100%;min-width:0}
.week-grid{display:grid;grid-template-columns:52px repeat(7,1fr);position:relative;width:100%;min-width:0}
.hour-label{font-size:10.5px;color:var(--text-tertiary);text-align:right;padding-right:10px;height:48px;display:flex;align-items:flex-start;padding-top:2px;margin-top:-6px;font-weight:500}
.day-col{border-right:1px solid var(--border);position:relative;min-height:1152px}
.day-col.today-col{background:rgba(26,115,232,.015)}
.hour-line{position:absolute;left:0;right:0;border-top:1px solid rgba(0,0,0,.05);height:48px}
.now-line{position:absolute;left:0;right:0;border-top:2px solid #ef4444;z-index:3}
.now-dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#ef4444}
.wb-block{position:absolute;left:4px;right:4px;border-radius:8px;padding:8px 10px;box-sizing:border-box;font-size:12px;z-index:1;background:#ccfbf1;color:#0d9488;border-left:3px solid #0d9488;overflow:hidden;line-height:1.3}

/* ── EVENTS ── */
.cal-event{position:absolute;left:4px;right:4px;border-radius:8px;padding:8px 10px;box-sizing:border-box;font-size:12px;cursor:pointer;z-index:2;overflow:hidden;transition:filter 150ms ease,box-shadow 150ms ease,transform 150ms ease;transform-origin:left center;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:3px}
.cal-event:hover{filter:brightness(.95);box-shadow:0 4px 12px rgba(0,0,0,.15);transform:scaleX(1.012)}
.cal-event.drift{border-left:3px solid #ef4444}
.cal-event.deadline-urgent:not(.drift){border-left:3px solid #d97706}
.cal-event.event-pop{animation:eventPop 200ms cubic-bezier(.34,1.4,.64,1) both}
@keyframes eventPop{from{transform:scaleY(0);opacity:0;transform-origin:top}to{transform:scaleY(1);opacity:1}}
.event-title{font-weight:600;font-size:12px;letter-spacing:-0.1px;line-height:1.3;min-height:0;overflow:hidden;word-wrap:break-word;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;line-clamp:4}
.event-time-label{opacity:.85;font-size:11px;font-weight:400;line-height:1.25;flex-shrink:0}
.event-deadline{font-size:10px;color:var(--text-tertiary);font-weight:400;letter-spacing:.01em;line-height:1.25;flex-shrink:0}
.drift-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:#ef4444;background:rgba(239,68,68,.12);border-radius:4px;padding:2px 6px;flex-shrink:0;animation:badgePulse 2.5s ease-in-out infinite}
@keyframes badgePulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ── VIEW LAYERS ── */
.view-layer{position:absolute;inset:0;width:100%;transition:opacity 160ms ease,transform 160ms ease;will-change:opacity,transform}
.view-layer.hidden{opacity:0;pointer-events:none;transform:translateY(8px)}
.view-layer.visible{opacity:1;transform:translateY(0)}
.week-view-wrap{overflow:hidden;display:flex;flex-direction:column;height:100%;width:100%;min-width:0}

/* ── TODAY VIEW ── */
.today-view{overflow-y:auto;padding:0;height:100%;width:100%;display:flex;gap:0;min-width:0}
.today-left{flex:1;min-width:0;overflow-y:auto;padding:32px 36px}
.today-right{width:272px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;padding:24px 18px;background:var(--surface-raised)}
.start-here{background:var(--blue-light);border-radius:var(--radius-xl);padding:22px 26px;margin-bottom:24px;border-left:4px solid var(--blue);animation:cardIn 220ms cubic-bezier(.4,0,.2,1) both;display:none;align-items:center;gap:14px;cursor:pointer;transition:filter 150ms ease,box-shadow 150ms ease}
.start-here:hover{filter:brightness(.99);box-shadow:0 2px 14px rgba(26,115,232,.12)}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.sh-card-text{flex:1;min-width:0}
.sh-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.sh-title{font-size:22px;font-weight:500;color:var(--text-primary);letter-spacing:-0.3px;margin-bottom:6px;line-height:1.25}
.sh-meta{font-size:13px;color:var(--text-secondary);line-height:1.45}
.sh-meta2{font-size:12px;color:var(--text-tertiary);margin-top:8px;line-height:1.45;display:none}
.sh-chevron{flex-shrink:0;font-size:22px;font-weight:300;color:var(--text-tertiary);line-height:1;padding-left:4px}
.tv-section-label{font-size:10px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;margin-top:22px}
.tv-task{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:box-shadow 150ms ease,border-color 150ms ease,transform 150ms ease;animation:taskIn 200ms ease both;opacity:0}
@keyframes taskIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.tv-task:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);border-color:var(--border-strong);transform:translateX(3px)}
.tv-task-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tv-task-info{flex:1}
.tv-task-title{font-size:14px;font-weight:500;color:var(--text-primary);letter-spacing:-0.1px}
.tv-task-meta{font-size:12px;color:var(--text-secondary);margin-top:2px}
.tv-task-due{font-size:11px;color:var(--text-tertiary);margin-top:3px}
.likelihood-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600}
.lp-high{background:#dcfce7;color:#15803d}
.lp-med{background:var(--amber-light);color:var(--amber)}
.lp-low{background:var(--red-light);color:var(--red)}
.lp-dot{width:5px;height:5px;border-radius:50%}
.lpd-h{background:#16a34a}.lpd-m{background:#f59e0b}.lpd-l{background:#ef4444}

/* ── BASICS SIDEBAR (today right col) ── */
.wb-sidebar-title{font-size:12px;font-weight:600;color:var(--text-tertiary);margin-bottom:14px;letter-spacing:.02em;text-transform:uppercase}
/* nudge card */
.wb-nudge-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:var(--text-primary);line-height:1.55;position:relative;animation:cardIn 200ms ease both}
.wb-nudge-dismiss{position:absolute;top:10px;right:10px;border:none;background:none;font-size:14px;color:var(--text-tertiary);cursor:pointer;padding:2px 5px;border-radius:4px;line-height:1;transition:color 150ms ease}
.wb-nudge-dismiss:hover{color:var(--text-primary)}
.wb-nudge-link{color:var(--blue);text-decoration:underline;cursor:pointer;background:none;border:none;font:inherit;font-size:13px;padding:0;display:inline;transition:opacity 150ms ease}
.wb-nudge-link:hover{opacity:.75}
/* simple checklist */
.wb-simple-list{display:flex;flex-direction:column;gap:0}
.wb-simple-item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity 150ms ease}
.wb-simple-item:last-child{border-bottom:none}
.wb-simple-item:hover{opacity:.7}
.wb-simple-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border-strong);flex-shrink:0;transition:background 180ms ease,border-color 180ms ease;display:flex;align-items:center;justify-content:center}
.wb-simple-dot.checked{background:#0d9488;border-color:#0d9488}
.wb-simple-dot.checked::after{content:'';display:block;width:5px;height:3.5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(.5px,-.5px)}
.wb-simple-label{font-size:13px;color:var(--text-primary);font-weight:400;letter-spacing:-0.05px}
.wb-simple-label.done{color:var(--text-tertiary);text-decoration:line-through}

/* ── INSIGHTS VIEW ── */
.insights-view{overflow-y:auto;padding:32px 36px;height:100%;width:100%;min-width:0;box-sizing:border-box}
.insights-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.ins-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;animation:cardIn 200ms ease both;position:relative;overflow:hidden}
.ins-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0}
.ins-card.accent-blue::before{background:var(--blue)}
.ins-card.accent-teal::before{background:var(--teal)}
.ins-card.accent-amber::before{background:#f59e0b}
.ins-card.accent-red::before{background:#ef4444}
.ins-card-label{font-size:10px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.ins-card-val{font-size:32px;font-weight:500;color:var(--text-primary);letter-spacing:-0.8px;margin-bottom:4px;line-height:1}
.ins-card-sub{font-size:12px;color:var(--text-secondary);font-weight:500}
.ins-card-sub.good{color:#15803d}
.ins-card-sub.warn{color:var(--amber)}
.ins-card-sub.bad{color:var(--red)}
.ins-section-title{font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.3px;margin-bottom:14px;margin-top:4px}
.ins-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}

/* bar chart */
.bar-chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.bar-chart-title{font-size:13px;font-weight:600;color:var(--text-primary);letter-spacing:-0.2px;margin-bottom:14px}
.bar-chart-bars{display:flex;align-items:flex-end;gap:6px;height:72px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.bar-pair{display:flex;gap:2px;align-items:flex-end;width:100%;justify-content:center}
.bar-seg{border-radius:3px 3px 0 0;min-width:8px;transition:height 400ms cubic-bezier(.4,0,.2,1)}
.bar-day-label{font-size:10px;color:var(--text-tertiary);margin-top:5px;font-weight:500}
.bar-legend{display:flex;gap:14px;margin-top:10px}
.bar-legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-secondary);font-weight:500}
.bar-legend-swatch{width:10px;height:10px;border-radius:2px}

/* energy heatmap */
.energy-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.energy-grid{display:grid;grid-template-columns:40px repeat(7,1fr);gap:3px;margin-top:8px}
.energy-cell{height:22px;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;color:transparent;transition:opacity 150ms ease;cursor:default}
.energy-cell:hover{opacity:.75}
.energy-row-label{font-size:10px;color:var(--text-tertiary);display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font-weight:500}
.energy-col-label{font-size:10px;color:var(--text-tertiary);text-align:center;font-weight:600}

/* basics this week table */
.wb-table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px}
.wb-table-title{font-size:13px;font-weight:600;color:var(--text-primary);letter-spacing:-0.1px;margin-bottom:14px}
.wb-table-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.wb-table-row:last-child{border-bottom:none}
.wb-table-label{font-size:13px;color:var(--text-secondary)}
.wb-table-val{font-size:13px;font-weight:500;color:var(--text-primary)}
.wb-table-val.warn{color:var(--amber)}
.wb-table-val.bad{color:var(--red)}

/* pattern insight cards — plain, no left border */
.pattern-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:12px;animation:cardIn 250ms ease both}
.pattern-icon{font-size:15px;margin-bottom:8px;color:var(--text-tertiary)}
.pattern-title{font-size:14px;font-weight:600;color:var(--text-primary);letter-spacing:-0.2px;margin-bottom:5px}
.pattern-body{font-size:13px;color:var(--text-secondary);line-height:1.6}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:100;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:background 180ms ease}
.modal-overlay.open{background:rgba(0,0,0,.5);pointer-events:all}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:520px;max-width:95vw;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.2);transform:scale(.92) translateY(14px);opacity:0;transition:transform 200ms cubic-bezier(.34,1.3,.64,1),opacity 170ms ease;will-change:transform,opacity}
.modal-overlay.open .modal{transform:scale(1) translateY(0);opacity:1}
.modal-top{padding:24px 28px 0}
.modal-title-input{width:100%;font-size:20px;font-weight:500;border:none;border-bottom:2px solid var(--blue);padding:4px 0 10px;outline:none;color:var(--text-primary);letter-spacing:-0.3px;transition:border-color 150ms ease}
.modal-title-input::placeholder{color:var(--text-tertiary)}
.modal-body{padding:16px 28px}
.modal-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.modal-row:last-child{border-bottom:none}
.modal-icon{color:var(--text-tertiary);font-size:17px;width:24px;text-align:center;flex-shrink:0}
.modal-field{flex:1;font-size:14px;color:var(--text-primary)}
.effort-pills{display:flex;gap:6px;flex-wrap:wrap}
.effort-pill{padding:6px 15px;border-radius:18px;border:1px solid var(--border-strong);background:transparent;font-size:13px;color:var(--text-primary);font-weight:500;transition:background 140ms ease,border-color 140ms ease,color 140ms ease,transform 120ms ease}
.effort-pill:hover{background:var(--surface-raised)}
.effort-pill:active{transform:scale(.95)}
.effort-pill.sel{background:var(--blue-light);border-color:var(--blue-border);color:var(--blue);font-weight:600}
.modal-footer{padding:14px 28px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;align-items:center}
.modal-cancel{padding:8px 18px;border-radius:20px;border:none;background:transparent;color:var(--blue);font-size:14px;font-weight:500;transition:background 150ms ease}
.modal-cancel:hover{background:var(--blue-light)}
.modal-optimize{padding:9px 22px;border-radius:20px;border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:600;letter-spacing:-0.1px;display:flex;align-items:center;gap:6px;transition:background 150ms ease,transform 150ms ease}
.modal-optimize:hover{background:#1765cc}
.modal-optimize:active{transform:scale(.97)}

/* ── RIGHT PANEL ── */
.rp-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#f8fafc 0%,#ffffff 60%)}
.rp-orb{width:26px;height:26px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rp-orb-inner{width:10px;height:10px;border-radius:50%;background:#fff}
.rp-title{font-size:14px;font-weight:600;color:var(--text-primary);letter-spacing:-0.2px}
.rp-close{margin-left:auto;border:none;background:transparent;color:var(--text-secondary);font-size:18px;line-height:1;padding:3px 7px;border-radius:50%;transition:background 150ms ease,transform 200ms ease}
.rp-close:hover{background:var(--surface-raised);transform:rotate(90deg)}
.rp-body{padding:20px}
.rp-content-enter{animation:rpIn 170ms ease both}
@keyframes rpIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.rp-task-name{font-size:16px;font-weight:600;color:var(--text-primary);letter-spacing:-0.3px;margin-bottom:4px}
.rp-sub{font-size:13px;color:var(--text-secondary);margin-bottom:18px}
.slot-card{border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:9px;cursor:pointer;transition:border-color 160ms ease,background 160ms ease,transform 150ms ease,box-shadow 160ms ease}
.slot-card:hover{border-color:var(--blue-border);background:#fafbff;transform:translateX(3px);box-shadow:0 2px 10px rgba(26,115,232,.1)}
.slot-card:active{transform:scale(.98)}
.slot-card.selected{border-color:var(--blue);background:var(--blue-light);transform:translateX(4px)}
.slot-time{font-size:14px;font-weight:600;color:var(--text-primary);letter-spacing:-0.2px}
.slot-why{font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.4}
.slot-due{font-size:10px;color:var(--text-tertiary);margin-top:6px;font-weight:500;letter-spacing:.02em}
.slot-pill-row{margin-top:8px}
.confirm-btn{width:100%;padding:12px;border-radius:var(--radius-xl);border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:600;letter-spacing:-0.1px;margin-top:14px;transition:background 150ms ease,transform 150ms ease,opacity 150ms ease}
.confirm-btn:hover{background:#1765cc}
.confirm-btn:active{transform:scale(.98)}
.confirm-btn:disabled{opacity:.6;cursor:default}
.confirm-btn.confirming{background:var(--teal)}

/* drift (demoted) */
.drift-panel{padding:20px}
.drift-header-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#ef4444;margin-bottom:6px}
.drift-task-name{font-size:18px;font-weight:600;color:var(--text-primary);letter-spacing:-0.3px;margin-bottom:4px}
.drift-count{font-size:13px;color:var(--text-secondary);margin-bottom:12px}
.drift-insight{background:var(--red-light);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:1.55}
.drift-insight strong{color:var(--text-primary);font-weight:600}
.drift-action{border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background 150ms ease,border-color 150ms ease,transform 150ms ease}
.drift-action:hover{background:var(--surface-raised);border-color:var(--border-strong);transform:translateX(3px)}
.drift-action-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.drift-action-title{font-size:13px;font-weight:600;color:var(--text-primary)}
.drift-action-sub{font-size:11px;color:var(--text-secondary);margin-top:2px}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:#1f2937;color:#fff;padding:13px 22px;border-radius:10px;font-size:13px;font-weight:500;z-index:200;pointer-events:none;opacity:0;letter-spacing:-0.1px;transition:transform 220ms cubic-bezier(.34,1.3,.64,1),opacity 200ms ease}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── IMPORT MODAL ── */
.import-btn{padding:8px 16px;border-radius:20px;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-secondary);font-size:13px;font-weight:600;letter-spacing:-0.1px;display:flex;align-items:center;gap:7px;transition:background 150ms ease,border-color 150ms ease,color 150ms ease,transform 150ms ease}
.import-btn:hover{background:var(--surface-raised);border-color:var(--blue);color:var(--blue)}
.import-btn:active{transform:scale(.97)}
.import-modal{background:var(--surface);border-radius:var(--radius-lg);width:560px;max-width:96vw;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.2);transform:scale(.92) translateY(14px);opacity:0;transition:transform 200ms cubic-bezier(.34,1.3,.64,1),opacity 170ms ease;will-change:transform,opacity}
.modal-overlay.open .import-modal{transform:scale(1) translateY(0);opacity:1}
.import-modal-header{padding:22px 26px 18px;border-bottom:1px solid var(--border)}

.import-modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}

/* platform picker */
.platform-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.platform-card{border:1.5px solid var(--border);border-radius:14px;padding:18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:border-color 160ms ease,background 160ms ease,transform 150ms ease,box-shadow 150ms ease}
.platform-card:hover{border-color:var(--blue-border);background:#fafbff;transform:translateY(-1px);box-shadow:0 3px 10px rgba(26,115,232,.08)}
.platform-card:active{transform:scale(.98)}
.platform-card.selected{border:1.5px solid var(--blue);background:var(--blue-light)}
.platform-logo{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;letter-spacing:-0.5px}
.platform-info{flex:1;min-width:0}
.platform-name{font-size:14px;font-weight:600;color:var(--text-primary);letter-spacing:-0.2px}
.platform-tagline{font-size:12px;color:var(--text-secondary);margin-top:2px;line-height:1.3}

/* spinner */
.import-spinner{width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 700ms linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.import-loading{display:flex;align-items:center;gap:12px;padding:20px 0;font-size:14px;color:var(--text-secondary);font-weight:500}

/* task review list */
.import-select-all-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:4px}
.import-count{font-size:13px;font-weight:600;color:var(--text-secondary);letter-spacing:-0.1px}
.import-select-all-btn{font-size:13px;font-weight:600;color:var(--blue);background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:8px;transition:background 150ms ease}
.import-select-all-btn:hover{background:var(--blue-light)}
.import-task-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);transition:background 150ms ease;border-radius:var(--radius-sm)}
.import-task-row:last-child{border-bottom:none}
.import-task-row:hover{background:var(--surface-raised)}
.import-checkbox{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--border-strong);background:var(--surface);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 150ms ease,border-color 150ms ease}
.import-checkbox.checked{background:var(--blue);border-color:var(--blue)}
.import-checkbox.checked::after{content:'';display:block;width:9px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.import-task-info{flex:1;min-width:0}
.import-task-name{font-size:13px;font-weight:500;color:var(--text-primary);letter-spacing:-0.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.import-task-meta{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.import-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px;letter-spacing:.02em}
.badge-due{background:#fef3c7;color:#92400e}
.badge-high{background:var(--red-light);color:var(--red)}
.badge-med{background:var(--amber-light);color:var(--amber)}
.badge-source{background:var(--surface-raised);color:var(--text-tertiary);border:1px solid var(--border)}

/* import queue in right panel */
.import-queue-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.import-queue-item:last-child{border-bottom:none}
.import-queue-num{width:20px;height:20px;border-radius:50%;background:var(--blue-light);color:var(--blue);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* imported event badge on calendar */

</style>

<script>
// ── DATA ──────────────────────────────────────────────────────────────
const EVENTS=[
  {id:1,title:'Algorithms problem set',day:1,startH:9,dur:2,color:'#1a73e8',bg:'#e8f0fe',effort:'2h',priority:'high',likelihood:'high',type:'deep',done:true,onTime:true,beforeDeadline:true,drift:false,driftCount:0,deadline:{day:2,hour:23}},
  {id:2,title:'Study group — Econ 201',day:1,startH:14,dur:1.5,color:'#8e24aa',bg:'#f3e8fd',effort:'1.5h',priority:'med',likelihood:'high',type:'light',done:true,onTime:false,beforeDeadline:false,drift:false,driftCount:0,deadline:{day:1,hour:13}},
  {id:3,title:'Portfolio update',day:0,startH:20,dur:2,color:'#ef4444',bg:'#fce8e6',effort:'2h',priority:'high',likelihood:'low',type:'deep',done:false,onTime:false,beforeDeadline:false,drift:true,driftCount:4,deadline:{day:1,hour:9}},
  {id:4,title:'Read: Chen et al. paper',day:2,startH:10,dur:1,color:'#0d9488',bg:'#e6f4ea',effort:'1h',priority:'med',likelihood:'med',type:'light',done:true,onTime:true,beforeDeadline:true,drift:false,driftCount:0,deadline:{day:3,hour:12}},
  {id:5,title:'Capstone outline draft',day:2,startH:13,dur:2,color:'#1a73e8',bg:'#e8f0fe',effort:'2h',priority:'high',likelihood:'high',type:'deep',done:true,onTime:true,beforeDeadline:false,drift:false,driftCount:0,deadline:{day:2,hour:15}},
  {id:6,title:'Reply to Prof. Martinez',day:3,startH:9,dur:.5,color:'#0d9488',bg:'#e6f4ea',effort:'30m',priority:'med',likelihood:'high',type:'light',done:true,onTime:true,beforeDeadline:true,drift:false,driftCount:0,deadline:{day:3,hour:17}},
  {id:7,title:'Review lecture slides',day:4,startH:15,dur:1,color:'#0d9488',bg:'#e6f4ea',effort:'1h',priority:'low',likelihood:'med',type:'light',done:false,onTime:false,beforeDeadline:false,drift:false,driftCount:0,deadline:{day:5,hour:21}},
];

// Wellbeing blocks (meals, breaks, sleep) — shown as dashed on grid
const WB_BLOCKS=[
  {day:1,startH:12.5,dur:.5,label:'Lunch',color:'#0d9488'},
  {day:2,startH:12,dur:.5,label:'Lunch',color:'#0d9488'},
  {day:3,startH:12.5,dur:.5,label:'Lunch',color:'#0d9488'},
];

const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_DATES=[6,7,8,9,10,11,12];

const TODAY_DAY=2;
const TODAY_NOW_H=9+25/60;
function computeDayLoads(){const loads=[0,0,0,0,0,0,0];EVENTS.forEach(e=>{loads[e.day]+=e.dur;});return loads;}
function deadlineToAbs(dl){return dl.day*24+dl.hour;}
function hoursUntilDeadline(dl){return deadlineToAbs(dl)-(TODAY_DAY*24+TODAY_NOW_H);}
function deadlineWithin24h(dl){const h=hoursUntilDeadline(dl);return h>=0&&h<=24;}
function effortToDur(eff){if(eff==='30m')return .5;if(eff==='1h'||eff==='1 hr')return 1;if(eff==='1.5h')return 1.5;if(eff==='2h')return 2;if(eff==='3h')return 3;return parseFloat(eff)||1;}
function slotEndsBeforeDeadline(day,startH,dur,dl){return day*24+startH+dur<=dl.day*24+dl.hour+.001;}
function daysFromTodayToDl(dl){return dl.day-TODAY_DAY;}

let selEffort='1h',selPriority='high',selSlot=0,driftEv=null,view='cal',panelOpen=false;

// wellbeing check state
let wbState={breakfast:true,lunch:false,break:false,sleep:true};

// ── HELPERS ──────────────────────────────────────────────────────────
function lc(l){return l==='high'?'lp-high':l==='med'?'lp-med':'lp-low'}
function ld(l){return l==='high'?'lpd-h':l==='med'?'lpd-m':'lpd-l'}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function lr(l){return l==='high'?"fits your usual focus hours":l==='med'?"you complete about half your tasks in this window":"you rarely finish tasks scheduled here"}
function loadColor(hrs){return hrs>4.5?'#ef4444':hrs>2.5?'#f59e0b':'#0d9488'}
function fmtH(h){const hr=Math.floor(h),min=Math.round((h-hr)*60),ap=hr<12?'AM':'PM',h12=hr%12||12;return min===0?`${h12} ${ap}`:`${h12}:${String(min).padStart(2,'0')} ${ap}`;}
function fmtDeadlineLine(dl){return`Due ${DAY_NAMES[dl.day]} ${fmtH(dl.hour)}`;}

function defaultDeadlineForOptimize(){
  if(selPriority==='high')return{day:Math.min(TODAY_DAY+1,6),hour:23};
  if(selPriority==='med')return{day:Math.min(TODAY_DAY+3,6),hour:17};
  return{day:6,hour:17};
}
const OPTIMIZE_CANDIDATES=[
  {day:3,startH:9,label:'Wed Apr 9, 9:00–10:00 AM',baseL:'high'},
  {day:3,startH:10,label:'Wed Apr 9, 10:00–11:00 AM',baseL:'high'},
  {day:4,startH:9,label:'Thu Apr 10, 9:00–10:00 AM',baseL:'med'},
  {day:4,startH:14,label:'Thu Apr 10, 2:00–3:00 PM',baseL:'med'},
  {day:5,startH:10,label:'Fri Apr 11, 10:00–11:00 AM',baseL:'high'},
  {day:2,startH:20,label:'Tonight, 8:00–9:00 PM',baseL:'low'},
  {day:6,startH:9,label:'Sat Apr 12, 9:00–10:00 AM',baseL:'med'},
  {day:1,startH:11,label:'Mon Apr 7, 11:00 AM – 12:00 PM',baseL:'med'},
];
function buildOptimizeSlots(effortDur,deadline){
  const loads=computeDayLoads();
  const dtd=daysFromTodayToDl(deadline);
  const scored=OPTIMIZE_CANDIDATES.map(c=>{
    const likelihood=c.baseL;
    let score=likelihood==='high'?40:likelihood==='med'?25:10;
    score-=loads[c.day]*3;
    const ends=c.day*24+c.startH+effortDur;
    const dlAbs=deadlineToAbs(deadline);
    if(ends>dlAbs+0.01)score-=80;
    if(dtd<=1&&c.startH<14)score+=25;
    if(dtd<=1&&c.startH>=19)score-=15;
    if(dtd<=2&&c.day<=deadline.day)score+=12;
    if(dtd>=3)score+=5;
    return{...c,likelihood,score,endsOk:ends<=dlAbs+0.01};
  }).sort((a,b)=>b.score-a.score);
  const top=scored.filter(x=>x.endsOk).length?scored.filter(x=>x.endsOk).slice(0,3):scored.slice(0,3);
  return top.map(c=>{
    let why;
    if(!c.endsOk)why='Ends after your deadline — not recommended.';
    else if(dtd<=1)why='Due tomorrow — earlier time increases your chances of finishing.';
    else if(dtd<=2)why='You tend to complete tasks earlier when deadlines are close.';
    else if(c.startH>=19)why='Low completion rate after 7 PM — you\'ll feel more energized tomorrow.';
    else if(loads[c.day]>4)why='Busy day — still fits before your deadline.';
    else why='Light schedule that day and you tend to focus well mid-morning.';
    return{day:c.day,startH:c.startH,label:c.label,why,likelihood:c.likelihood,deadlineLabel:fmtDeadlineLine(deadline)};
  });
}

// ── SIDEBAR LOAD BARS ─────────────────────────────────────────────────
function buildSidebarLoad(){
  const c=document.getElementById('sidebar-load-bars');c.innerHTML='';

// ── WEEK HEADER ───────────────────────────────────────────────────────
function buildWeekHeader(){
  const h=document.getElementById('week-header');
  h.innerHTML='';
  const sp=document.createElement('div');sp.className='wh-spacer';h.appendChild(sp);

// ── WEEK GRID ─────────────────────────────────────────────────────────
function buildWeekGrid(){
  const g=document.getElementById('week-grid');g.innerHTML='';
  const lc2=document.createElement('div');lc2.style.cssText='display:flex;flex-direction:column;';
  for(let h=0;h<24;h++){const e=document.createElement('div');e.className='hour-label';e.textContent=h===0?'':fmtH(h);lc2.appendChild(e);}
  g.appendChild(lc2);
  for(let di=0;di<7;di++){
    const col=document.createElement('div');col.className='day-col'+(di===2?' today-col':'');col.style.minHeight='1152px';
    for(let h=0;h<24;h++){const ln=document.createElement('div');ln.className='hour-line';ln.style.top=(h*48)+'px';col.appendChild(ln);}
    if(di===2){const m=9*60+25;const nl=document.createElement('div');nl.className='now-line';nl.style.top=((m/60)*48)+'px';nl.innerHTML='<div class="now-dot"></div>';col.appendChild(nl);}
    // wellbeing blocks
    WB_BLOCKS.filter(b=>b.day===di).forEach(b=>{
      const el=document.createElement('div');
      el.className='wb-block';
      el.style.cssText=`top:${b.startH*48}px;height:${b.dur*48-2}px;color:${b.color};border-color:${b.color};background:${b.color}18;`;
      el.innerHTML=`<span style="font-weight:500">${b.label}</span>`;
      col.appendChild(el);
    });
    // task events
    EVENTS.filter(e=>e.day===di).forEach((ev,i)=>{
      const el=buildEventEl(ev);el.style.animationDelay=(i*45)+'ms';col.appendChild(el);
    });
    g.appendChild(col);
  }
}

function buildEventEl(ev){
  const el=document.createElement('div');
  const urg=!ev.drift&&ev.deadline&&deadlineWithin24h(ev.deadline);
  const bord=ev.drift?'#ef4444':urg?'#d97706':ev.color;
  el.className='cal-event event-pop'+(ev.drift?' drift':'')+(urg?' deadline-urgent':'');
  el.style.cssText=`top:${ev.startH*48}px;height:${ev.dur*48-4}px;background:${ev.bg};color:${ev.color};border-left:3px solid ${bord};`;
  const dl=ev.deadline?`<div class="event-deadline">${fmtDeadlineLine(ev.deadline)}</div>`:'';
  el.innerHTML=`<div class="event-title">${ev.title}</div><div class="event-time-label">${fmtH(ev.startH)} – ${fmtH(ev.startH+ev.dur)}</div>${dl}${ev.drift?'<div class="drift-badge">⟳ Drifting</div>':''}`;
  el.addEventListener('click',()=>ev.drift?showDriftPanel(ev):showEventPanel(ev));
  return el;
}

// ── VIEW SWITCH ───────────────────────────────────────────────────────
function switchView(v){
  if(v===view) return;
  const layers={cal:'layer-cal',today:'layer-today',insights:'layer-insights'};
  document.getElementById(layers[view]).classList.remove('visible');
  document.getElementById(layers[view]).classList.add('hidden');
  view=v;
  const next=document.getElementById(layers[v]);
  next.classList.remove('hidden');
  requestAnimationFrame(()=>requestAnimationFrame(()=>next.classList.add('visible')));
  ['nav-cal','nav-today','nav-insights'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById('nav-'+v).classList.add('active');
  if(v==='today') buildTodayView();
  if(v==='insights') buildInsightsView();
  if(v==='cal') closePanel();
}

// ── TODAY VIEW ────────────────────────────────────────────────────────
function buildTodayView(){
  const high=document.getElementById('tv-high'),light=document.getElementById('tv-light');
  high.innerHTML='';light.innerHTML='';
  const todayEvs=EVENTS.filter(e=>e.day===TODAY_DAY&&!e.done).sort((a,b)=>a.startH-b.startH);
  const nowH=TODAY_NOW_H;
  const current=todayEvs.find(e=>e.startH<=nowH&&nowH<e.startH+e.dur);
  const nextUp=todayEvs.find(e=>e.startH>nowH);
  const nextAfterCurrent=current&&todayEvs.find(e=>e!==current&&e.startH>=current.startH+current.dur-1e-6);
  const shCard=document.getElementById('start-here-card');
  const shLabel=document.getElementById('sh-label');
  const shTitle=document.getElementById('sh-title');
  const shMeta=document.getElementById('sh-meta');
  const shMeta2=document.getElementById('sh-meta2');
  let heroExclude=null;

  shCard.style.display='flex';
  if(!todayEvs.length){
    shLabel.textContent='TODAY';
    shTitle.textContent='Nothing scheduled today';
    shMeta.textContent='Add something from the calendar or create a task.';
    shMeta2.style.display='none';
    shMeta2.textContent='';
    shCard.onclick=()=>switchView('cal');
  }else if(current){
    shLabel.textContent='NOW';
    shTitle.textContent=current.title;
    shMeta.textContent=`${fmtH(current.startH)} – ${fmtH(current.startH+current.dur)} · ${current.effort}`;
    if(nextAfterCurrent){
      shMeta2.textContent=`Next: ${nextAfterCurrent.title} · ${fmtH(nextAfterCurrent.startH)} – ${fmtH(nextAfterCurrent.startH+nextAfterCurrent.dur)}${nextAfterCurrent.effort?' · '+nextAfterCurrent.effort:''}`;
      shMeta2.style.display='block';
    }else{
      shMeta2.style.display='none';
      shMeta2.textContent='';
    }
    heroExclude=current;
    shCard.onclick=()=>{switchView('cal');setTimeout(()=>current.drift?showDriftPanel(current):showEventPanel(current),200);};
  }else if(nextUp){
    shLabel.textContent='NEXT';
    shTitle.textContent=nextUp.title;
    shMeta.textContent=`${fmtH(nextUp.startH)} – ${fmtH(nextUp.startH+nextUp.dur)}${nextUp.effort?' · '+nextUp.effort:''}`;
    shMeta2.style.display='none';
    shMeta2.textContent='';
    heroExclude=nextUp;
    shCard.onclick=()=>{switchView('cal');setTimeout(()=>nextUp.drift?showDriftPanel(nextUp):showEventPanel(nextUp),200);};
  }else{
    const last=todayEvs[todayEvs.length-1];
    shLabel.textContent='OPEN';
    shTitle.textContent='No more tasks today';
    shMeta.textContent=`${fmtH(nowH)} · Free until end of day`;
    shMeta2.textContent=`Last: ${last.title} · ended ${fmtH(last.startH+last.dur)}`;
    shMeta2.style.display='block';
    shCard.onclick=()=>switchView('cal');
  }

  todayEvs.forEach((ev,i)=>{
    if(ev===heroExclude) return;
    const div=document.createElement('div');div.className='tv-task';div.style.animationDelay=(i*65+80)+'ms';
    div.onclick=()=>{switchView('cal');setTimeout(()=>ev.drift?showDriftPanel(ev):showEventPanel(ev),200);};
    div.innerHTML=`<div class="tv-task-dot" style="background:${ev.color}"></div><div class="tv-task-info"><div class="tv-task-title">${ev.title}</div><div class="tv-task-meta">${fmtH(ev.startH)} · ${ev.effort}</div>${ev.deadline?`<div class="tv-task-due">${fmtDeadlineLine(ev.deadline)}</div>`:''}</div><div class="likelihood-pill ${lc(ev.likelihood)}"><div class="lp-dot ${ld(ev.likelihood)}"></div>${cap(ev.likelihood)}</div>`;
    (ev.type==='deep'?high:light).appendChild(div);
  });
  EVENTS.filter(e=>e.day!==TODAY_DAY&&e.type==='light').slice(0,2).forEach((ev,i)=>{
    const div=document.createElement('div');div.className='tv-task';div.style.animationDelay=((i+3)*65+80)+'ms';
    div.innerHTML=`<div class="tv-task-dot" style="background:${ev.color}"></div><div class="tv-task-info"><div class="tv-task-title">${ev.title}</div><div class="tv-task-meta">${ev.effort} · Could do any time</div></div><div class="likelihood-pill ${lc(ev.likelihood)}"><div class="lp-dot ${ld(ev.likelihood)}"></div>${cap(ev.likelihood)}</div>`;
    light.appendChild(div);
  });
  buildWellbeingSidebar();
}

function buildWellbeingSidebar(){
  const wb=document.getElementById('today-wellbeing');
  const nudgeDismissed=window._nudgeDismissed||false;

  const items=[
    {key:'breakfast',label:'Breakfast'},
    {key:'lunch',label:'Lunch break'},
    {key:'break',label:'Afternoon break'},
    {key:'sleep',label:'Sleep ~11 PM'},
  ];

  // Pick one nudge based on state
  let nudgeHtml='';
  if(!nudgeDismissed){
    if(!wbState.lunch&&!wbState.break){
      nudgeHtml=`<div class="wb-nudge-card">
        <button class="wb-nudge-dismiss" onclick="window._nudgeDismissed=true;buildWellbeingSidebar()">✕</button>
        You have 5.5 hrs of tasks today with no break.
        <br><button class="wb-nudge-link" onclick="addWbBlock('lunch')">Add lunch at 12:30 PM →</button>
      </div>`;
    } else if(!wbState.lunch){
      nudgeHtml=`<div class="wb-nudge-card">
        <button class="wb-nudge-dismiss" onclick="window._nudgeDismissed=true;buildWellbeingSidebar()">✕</button>
        No lunch block on your calendar today.
        <br><button class="wb-nudge-link" onclick="addWbBlock('lunch')">Add lunch at 12:30 PM →</button>
      </div>`;
    } else if(wbState.lunch&&wbState.break&&wbState.breakfast){
      nudgeHtml=`<div class="wb-nudge-card">
        <button class="wb-nudge-dismiss" onclick="window._nudgeDismissed=true;buildWellbeingSidebar()">✕</button>
        Light day — good time to tackle something you've been avoiding.
      </div>`;
    }
  }

  wb.innerHTML=`
    <div class="wb-sidebar-title">Today's basics</div>
    ${nudgeHtml}
    <div class="wb-simple-list">
      ${items.map(item=>{
        const done=wbState[item.key];
        return `<div class="wb-simple-item" onclick="toggleWb('${item.key}')">
          <div class="wb-simple-dot${done?' checked':''}"></div>
          <span class="wb-simple-label${done?' done':''}">${item.label}</span>
        </div>`;
      }).join('')}
    </div>`;
}

function toggleWb(key){
  wbState[key]=!wbState[key];
  buildWellbeingSidebar();
  if(wbState[key]) showToast(`${key==='breakfast'?'Breakfast':key==='lunch'?'Lunch break':key==='break'?'Afternoon break':'Sleep'} marked done`);
}

function addWbBlock(key){
  wbState[key]=true;
  if(key==='lunch') WB_BLOCKS.push({day:2,startH:12.5,dur:.5,label:'Lunch',color:'#0d9488'});
  if(key==='break') WB_BLOCKS.push({day:2,startH:15,dur:.25,label:'Break',color:'#0d9488'});
  window._nudgeDismissed=false;
  buildWellbeingSidebar();
  buildWeekGrid();
  showToast('Added to your calendar');
}

function showDayLoadPanel(dayIdx){
  const load=computeDayLoads()[dayIdx];
  const events=EVENTS.filter(e=>e.day===dayIdx);
  const color=loadColor(load);
  const status=load>4.5?'Heavy load':load>2.5?'Moderate load':'Light day';
  const statusDetail=load>4.5?'This day exceeds your realistic focus capacity. Consider moving a task to Wednesday, which is free.':load>2.5?'Manageable but watch for back-to-back deep work blocks.':'Good balance — room to add tasks if needed.';

  openPanel(`
    <div class="rp-header">
      <div class="rp-orb" style="background:${color}"><div class="rp-orb-inner"></div></div>
      <div class="rp-title">${DAY_NAMES[dayIdx]}, Apr ${DAY_DATES[dayIdx]}</div>
      <button class="rp-close" onclick="closePanel()">✕</button>
    </div>
    <div class="rp-body rp-content-enter">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div style="font-size:26px;font-weight:400;color:${color}">${load}h</div>
        <div>
          <div style="font-size:14px;font-weight:500;color:#202124">${status}</div>
          <div style="font-size:12px;color:#5f6368">of ~5 hr realistic capacity</div>
        </div>
      </div>
      <div style="height:6px;background:#f1f3f4;border-radius:3px;margin-bottom:6px;overflow:hidden">
        <div style="height:100%;width:${Math.min(load/5*100,100)}%;background:${color};border-radius:3px;transition:width 500ms ease"></div>
      </div>
      <div style="font-size:12px;color:#5f6368;margin-bottom:16px;line-height:1.5">${statusDetail}</div>
      ${events.length?`
        <div style="font-size:12px;font-weight:600;color:#5f6368;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Tasks this day</div>

function driftBreak(){
  const base=driftEv;if(!base) return;closePanel();
  setTimeout(()=>{
    let nextId=EVENTS.reduce((m,e)=>Math.max(m,e.id),0);
    [1,2,3].forEach((d,i)=>{
      nextId++;
      const dl=base.deadline
        ?{day:base.deadline.day,hour:base.deadline.hour}
        :{day:d,hour:17};
      EVENTS.push({id:nextId,title:base.title+` (${i+1}/3)`,day:d,startH:9+i,dur:.67,color:base.color,bg:base.bg,effort:'40m',priority:base.priority,likelihood:'high',type:base.type,done:false,drift:false,driftCount:0,deadline:dl});
    });
    const idx=EVENTS.findIndex(e=>e.id===base.id);if(idx>-1) EVENTS.splice(idx,1);
    buildWeekGrid();showToast('Split into 3 sessions across Mon–Wed 9 AM.');
  },220);
}
function driftRemove(){
  if(!driftEv) return;
  const idx=EVENTS.findIndex(e=>e.id===driftEv.id);if(idx>-1) EVENTS.splice(idx,1);
  buildWeekGrid();closePanel();showToast('Task removed from your calendar.');
}

const IMPORT_SLOT_POOL=[
  {day:3,startH:10,label:'Thu Apr 10, 10 AM'},
  {day:3,startH:14,label:'Thu Apr 10, 2 PM'},
  {day:4,startH:9,label:'Fri Apr 11, 9 AM'},
  {day:4,startH:13,label:'Fri Apr 11, 1 PM'},
  {day:5,startH:10,label:'Sat Apr 12, 10 AM'},
  {day:5,startH:14,label:'Sat Apr 12, 2 PM'},
  {day:1,startH:11,label:'Mon Apr 14, 11 AM'},
  {day:2,startH:15,label:'Tue Apr 15, 3 PM'},
  {day:2,startH:9,label:'Tue Apr 8, 9 AM'},
  {day:6,startH:11,label:'Sat Apr 12, 11 AM'},
];
function parseDueToDeadline(dueStr,seed){
  if(!dueStr){
    const off=2+(seed%5);
    return{day:Math.min(TODAY_DAY+off,6),hour:17};
  }
  const n=parseInt(String(dueStr).replace(/\D/g,''),10);
  if(n>=6&&n<=12)return{day:n-6,hour:17};
  if(n<6)return{day:0,hour:12};
  return{day:6,hour:17};
}
function priorityToImportDur(p){return p==='high'?1.5:p==='med'?1:.5;}
function assignImportSlots(selected){
  const loads=computeDayLoads();
  const enriched=selected.map((t,i)=>({task:t,deadline:parseDueToDeadline(t.due,i),dur:priorityToImportDur(t.priority)}));
  enriched.sort((a,b)=>deadlineToAbs(a.deadline)-deadlineToAbs(b.deadline));
  const taken=new Set();
  return enriched.map((row,idx)=>{
    let best=null,bestScore=-1e9;
    for(const p of IMPORT_SLOT_POOL){
      const key=p.day+'-'+p.startH;
      if(taken.has(key))continue;
      const ends=p.day*24+p.startH+row.dur;
      if(ends>deadlineToAbs(row.deadline)+0.01)continue;
      let sc=120-loads[p.day]*8-Math.max(0,(deadlineToAbs(row.deadline)-ends))*2;
      if(p.startH>=9&&p.startH<=11)sc+=15;
      if(row.dur>=1.5&&p.startH>=14)sc-=5;
      if(sc>bestScore){bestScore=sc;best={...p};}
    }
    if(!best){
      let fbScore=-1e9;
      for(const p of IMPORT_SLOT_POOL){
        const key=p.day+'-'+p.startH;
        if(taken.has(key))continue;
        let sc=80-loads[p.day]*6;
        const ends=p.day*24+p.startH+row.dur;
        if(ends>deadlineToAbs(row.deadline))sc-=50;
        if(sc>fbScore){fbScore=sc;best={...p};}
      }
    }
    if(!best)best={...IMPORT_SLOT_POOL[idx%IMPORT_SLOT_POOL.length]};
    taken.add(best.day+'-'+best.startH);
    loads[best.day]+=row.dur;
    return{task:row.task,deadline:row.deadline,dur:row.dur,slot:best};
  });
}

                <div class="import-queue-slot">→ ${a.slot.label}</div>
              </div>
            </div>`).join('')}
        </div>
        <button class="confirm-btn" onclick="confirmImport()">Confirm all ${selected.length} tasks</button>
        <div style="font-size:11px;color:var(--text-tertiary);text-align:center;margin-top:10px;line-height:1.5">
          Slots respect deadlines, effort &amp; current load.<br>Tap any event to reschedule.
        </div>
      </div>`);

    // Store for confirm step
    window._pendingImport={assignments,platform:p};
  },80);
}

function confirmImport(){
  const {assignments,platform}=window._pendingImport||{};
  if(!assignments) return;
  assignments.forEach(a=>{
    const slot=a.slot;
    const dur=a.dur;
    const effStr=dur===.5?'30m':dur===1?'1h':dur===1.5?'1.5h':dur+'h';
    EVENTS.push({
      id:Date.now()+Math.random(),
      title:a.task.name,
      day:slot.day,
      startH:slot.startH,
      dur,
      color:'#7c3aed',
      bg:'#f5f3ff',
      effort:effStr,
      priority:a.task.priority==='none'?'low':a.task.priority,
      likelihood:'high',
      type:'light',
      done:false,
      drift:false,
      driftCount:0,
      imported:true,
      source:platform.name,
      deadline:a.deadline,
    });
  });
  buildWeekGrid();buildSidebarLoad();buildWeekHeader();
  closePanel();
  showToast(`${assignments.length} task${assignments.length>1?'s':''} added to your calendar`);
  window._pendingImport=null;
}

const _origBuildEventEl=buildEventEl;
buildEventEl=function(ev){
  if(!ev.imported) return _origBuildEventEl(ev);
  const el=document.createElement('div');
  const urg=ev.deadline&&deadlineWithin24h(ev.deadline);
  const bord=urg?'#d97706':'#7c3aed';
  el.className='cal-event event-pop'+(urg?' deadline-urgent':'');
  el.style.cssText=`top:${ev.startH*48}px;height:${ev.dur*48-4}px;background:#f5f3ff;color:#7c3aed;border-left:3px solid ${bord};`;
  const dl=ev.deadline?`<div class="event-deadline">${fmtDeadlineLine(ev.deadline)}</div>`:'';
  el.innerHTML=`
    <div class="event-title">${ev.title}</div>
    <div class="event-time-label">${fmtH(ev.startH)} – ${fmtH(ev.startH+ev.dur)}</div>
    ${dl}
    <div class="import-source-badge">↓ ${ev.source}</div>`;
  el.addEventListener('click',()=>showEventPanel(ev));
  return el;
};

buildMiniCal();buildSidebarLoad();buildWeekHeader();buildWeekGrid();
</script>
</body>
</html>
